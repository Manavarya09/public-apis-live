name: refresh
on:
  schedule:
    - cron: "0 6 * * *"   # 10:00 Dubai
    - cron: "0 14 * * *"  # 18:00 Dubai — fallback in case GitHub drops the morning run
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm refresh
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md BENCHMARK.md packages/core/apis.json
          git diff --staged --quiet || git commit -m "chore: daily refresh $(date -u +%F)"
          git pull --rebase origin main
          git push
